name: Android Fastlane with Firebase App Distribution

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  distribute_to_firebase:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.7"
          cache: true

      - name: Create .env
        run: |
          cat <<EOF > .env
          ${{ secrets.DOT_ENV }}
          EOF

      - name: Create Firebase Service Account
        run: |
          cat <<EOF > firebase-service-account.json
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EOF

      - name: Verify Generated Files
        run: |
          echo "========== Files =========="
          ls -lh
          test -f .env
          test -f firebase-service-account.json

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Install Gems
        working-directory: android
        run: |
          bundle config set path vendor/bundle
          bundle install

      - name: Show Fastlane Version
        working-directory: android
        run: bundle exec fastlane --version

      - name: Run Fastlane
        working-directory: android
        env:
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
        run: |
          bundle exec fastlane dist

      - name: Verify APK
        if: always()
        run: |
          echo "========== APK =========="
          ls -lh build/app/outputs/flutter-apk/ || true

          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            echo ""
            echo "========== SHA256 =========="
            sha256sum build/app/outputs/flutter-apk/app-release.apk
          fi

      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: ignore